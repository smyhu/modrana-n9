## this config file configures the available map layers
## modRana N9 (2026): new list of maps, checked on 28.10.2026.
## https:// addresses are fetched by the HTTPS helper (/opt/modrana/n9/https-helper,
## needs the TLS 1.2 patch), http:// addresses are fetched by modRana itself.
## Labels in quotes: without them a comma turns the text into a list.
## The old list (servers dead since 2013) is in map_config.conf_old_revision_15
## in the profile folder.

revision=18 ## configuration file revision

## !! PUT THE URL IN QUOTES !!

## Layers section
[layers]

[[mapnik]]
  label="OpenStreetMap"
  url="https://tile.openstreetmap.org/${z}/${x}/${y}.png"
  type=png
  max_zoom=19
  min_zoom=0
  folder_prefix=OpenStreetMap I
  coordinates=web_mercator_substitution
  group="a_base"

