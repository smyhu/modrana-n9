## this config file configures the available map layers
## modRana N9 (2026): nowa lista map, sprawdzona 28.10.2026.
## Adresy https:// pobiera pomocnik HTTPS (/opt/modrana/n9/tlumacz-https,
## wymaga latki TLS 1.2), adresy http:// pobiera modRana sam.
## Etykiety w cudzyslowach: przecinek bez nich zamienia tekst w liste.
## Stara lista (martwe serwery z 2013 r.) jest w map_config.conf_old_revision_15
## w katalogu profilu.

revision=17 ## configuration file revision

